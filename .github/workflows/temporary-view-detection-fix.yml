name: Correct NovaraDesk view detection

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prioritize the visible page heading
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path("index.html")
          html=path.read_text(encoding="utf-8")
          marker="NOVARA_DESK_PARENT_VIEW_BRIDGE_V1"
          if marker not in html:
              raise SystemExit("Bridge marker was not found")
          before,bridge=html.split(marker,1)
          pattern=r"function activeView\(\)\{.*?\n\s*\}\n\s*function notify\(\)\{"
          replacement="""function activeView(){
              var headings=[
                document.querySelector('.page-header h1'),
                document.querySelector('.main-content h1'),
                document.querySelector('main h1'),
                document.querySelector('[data-page-title]'),
                ...document.querySelectorAll('h1')
              ].filter(Boolean);
              for(var i=headings.length-1;i>=0;i--){
                var key=detect(headings[i].textContent);
                if(key)return key;
              }
              var activeItems=[...document.querySelectorAll('[aria-current="page"],[aria-selected="true"],.sidebar .active,.nav-item.active,.menu-item.active,[class*="sidebar"] .active')];
              for(var j=activeItems.length-1;j>=0;j--){
                key=detect((activeItems[j].getAttribute('aria-label')||'')+' '+activeItems[j].textContent);
                if(key)return key;
              }
              return detect(location.pathname+' '+document.title);
            }
            function notify(){"""
          bridge,count=re.subn(pattern,replacement,bridge,count=1,flags=re.S)
          if count!=1:
              raise SystemExit(f"activeView replacement count was {count}")
          html=before+"NOVARA_DESK_PARENT_VIEW_BRIDGE_V2"+bridge
          path.write_text(html,encoding="utf-8")
          PY
      - name: Remove temporary workflow
        run: git rm .github/workflows/temporary-view-detection-fix.yml
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Prioritize visible page in view sync"
          git push
